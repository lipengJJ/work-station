worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include mime.types;
  default_type application/octet-stream;

  types {
    application/javascript  js mjs;
    text/css                css;
    text/html               html;
  }

  sendfile on;
  gzip on;
  gzip_types text/plain text/css application/javascript application/json;

  server {
    listen 8080;
    server_name localhost;

    # 反向代理到 backend 容器（docker-compose 里的服务名），和前端同源，
    # 浏览器端不用关心 backend 具体跑在哪个地址，也不需要额外配置 CORS
    location /api/ {
      proxy_pass http://backend:8010/api/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # AI 分析/AI 助手走 SSE 流式响应：nginx 默认 proxy_read_timeout 60s、
      # proxy_buffering 默认开着，大上下文/复杂生成场景下 60 秒读超时会在这一层
      # 就把连接掐断（跟 gemini_client.py 那个 60 秒超时是同一类问题，不能只改后端），
      # 而且开着缓冲的话前端根本收不到增量，得等 nginx 攒够一批才转发，等于假流式。
      proxy_read_timeout 300s;
      proxy_buffering off;
    }

    # SPA 入口：no-cache（部署后浏览器必须重新验证 index.html，否则用户一直看到旧页面）
    location = /index.html {
      root /usr/share/nginx/html;
      add_header Cache-Control "no-cache";
    }

    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
      index index.html;
      # 构建产物带内容 hash：长缓存 + immutable，刷新时走本地缓存秒开
      location ~* \.(js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
      }
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
      root /usr/share/nginx/html;
    }
  }
}
