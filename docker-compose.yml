services:
  backend:
    build:
      context: ./backend
    # 独立工作区部署：容器名加 -notify 后缀，避免与主工作区（workbench-backend）容器冲突
    container_name: workbench-notify-backend
    environment:
      # 生产环境必须自己设置一个真正的密钥（用来签 JWT），默认值只适合本地开发。
      # 没设置的话 docker compose up 会直接报错退出，而不是悄悄用不安全的默认值跑起来。
      - WORKBENCH_SECRET_KEY=${WORKBENCH_SECRET_KEY:?请设置 WORKBENCH_SECRET_KEY 环境变量（生产环境必须使用随机的强密钥，不要用默认值）}
      - WORKBENCH_DATABASE_URL=sqlite:////app/data/workbench.db
    volumes:
      # 直接映射到宿主机目录（bind mount）：
      #   ./data     → 数据库 workbench.db + 配置镜像 config.json（API key / cookie / token）
      #   ./storage  → xhs 采集产出（Excel/素材）
      # 好处：重启/重建容器、甚至 down -v 清卷，数据都在宿主机目录里，随时可查看/备份；
      # 配置会自动从 config.json 恢复，不需要重新填 API key。
      - ./data:/app/data
      - ./storage:/app/storage
    ports:
      - "${BACKEND_PORT:-8010}:8010"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: workbench-notify-frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:8080"
    restart: unless-stopped
