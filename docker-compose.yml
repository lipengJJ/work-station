services:
  backend:
    build:
      context: ./backend
    container_name: workbench-backend
    environment:
      # 生产环境必须自己设置一个真正的密钥（用来签 JWT），默认值只适合本地开发。
      # 没设置的话 docker compose up 会直接报错退出，而不是悄悄用不安全的默认值跑起来。
      - WORKBENCH_SECRET_KEY=${WORKBENCH_SECRET_KEY:?请设置 WORKBENCH_SECRET_KEY 环境变量（生产环境必须使用随机的强密钥，不要用默认值）}
      - WORKBENCH_DATABASE_URL=sqlite:////app/data/workbench.db
    volumes:
      # sqlite 数据库和 xhs 采集任务的产出（Excel/素材）分开挂载，容器重建/重启都不会丢
      - backend_data:/app/data
      - backend_storage:/app/storage
    ports:
      - "${BACKEND_PORT:-8010}:8010"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: workbench-frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:8080"
    restart: unless-stopped

volumes:
  backend_data:
  backend_storage:
